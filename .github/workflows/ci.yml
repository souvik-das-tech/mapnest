name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API (Go)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server/msapi
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          # Newest 1.26 patch release: security fixes in the standard library.
          go-version: "1.26"
          check-latest: true
          cache-dependency-path: server/msapi/go.sum
      - name: Modules verified against go.sum
        run: go mod verify
      - name: gofmt
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then echo "Run gofmt on:"; echo "$out"; exit 1; fi
      - name: go vet
        run: go vet ./...
      - name: Tests (race detector)
        run: go test -race -count=1 ./...
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  web:
    name: Web UI (TypeScript)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --ignore-scripts --no-fund
      - name: Type check and build
        run: npm run build
      - name: npm audit (production dependencies, high and above)
        run: npm audit --omit=dev --audit-level=high

  images:
    name: Docker images
    runs-on: ubuntu-latest
    needs: [api, web]
    steps:
      - uses: actions/checkout@v7
      - name: Build msapi
        run: docker build --pull -t mapnest-msapi:ci --build-arg VERSION=${{ github.sha }} server/msapi
      - name: Build web
        run: docker build --pull -t mapnest-web:ci web
      - name: Trivy scan of the web image (fails on fixable HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: mapnest-web:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      # msapi is built on the upstream MapServer image; its OS packages are
      # reported here but do not fail the build (upgrade the base image instead).
      - name: Trivy scan of the msapi image (report only)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: mapnest-msapi:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "0"
