# Security headers for the admin UI (static files). Included per location
# because a location's own add_header would otherwise drop the server's.
#
# CSP: scripts only from this origin (no inline script, no eval). Styles
# allow 'unsafe-inline' because Radix UI and CodeMirror set style
# attributes at runtime. Map tiles come from OpenStreetMap.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://tile.openstreetmap.org https://*.tile.openstreetmap.org; font-src 'self' data:; connect-src 'self'; worker-src 'self' blob:; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
# OpenStreetMap's tile policy needs a Referer; send only the origin.
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
# Only sent when the browser came over HTTPS (empty value = no header).
add_header Strict-Transport-Security $mapnest_hsts always;
