# Virtual host for port 80, mounted as sites-enabled/000-0-mapnest.conf so
# it loads before the image's 000-default.conf and becomes the default vhost
# (the image's start script edits 000-default.conf in place, so that file
# cannot be mounted over). Same settings as the image's, plus the workspace
# endpoints: /ows/<workspace>?SERVICE=WMS&... serves
# /etc/mapserver/ws_<workspace>.map, generated by msapi. Rewrite rules must
# live inside the <VirtualHost>; server-level ones are not applied here.
# Needs rewrite.load (mod_rewrite ships with the image but is off). PT hands
# the result back to the image's ScriptAliasMatch, so it still reaches mapserv.

# --- Hardening (docs/security/VAPT-L1.md) ------------------------------------
# sites-enabled is read after conf-enabled, so these win over the image's
# security.conf. No version or OS in the Server header or error pages, no
# TRACE (cross-site tracing).
ServerTokens Prod
ServerSignature Off
TraceEnable Off
FileETag None

<VirtualHost *:80>
	ServerAdmin webmaster@localhost
	DocumentRoot /var/www/html
	ErrorLog /proc/self/fd/2
	CustomLog /proc/self/fd/1 combined

	# Nothing but the OGC services is served: no directory listings, no
	# .htaccess overrides, only GET/POST/HEAD.
	<Directory /var/www/html>
		Options -Indexes -FollowSymLinks
		AllowOverride None
	</Directory>
	<LocationMatch "^/">
		<LimitExcept GET POST HEAD>
			Require all denied
		</LimitExcept>
	</LocationMatch>

	RewriteEngine On
	RewriteRule "^/ows/([a-z][a-z0-9_]*)/?$" "/?map=/etc/mapserver/ws_$1.map" [QSA,PT]

	<IfModule mod_headers.c>
		Header always set X-Content-Type-Options "nosniff"
		Header always set Referrer-Policy "strict-origin-when-cross-origin"
		Header always set Content-Security-Policy "default-src 'none'; img-src 'self' data:; style-src 'unsafe-inline'; sandbox"
		Header always unset X-Powered-By
	</IfModule>
</VirtualHost>
