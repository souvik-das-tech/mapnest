# MapServer config used only by msapi's mapserv CLI calls (mapfile
# validation and unsaved-style previews): allows map= paths inside the
# mapfile dir so a temp mapfile can be used before it goes live. Never
# mounted into the public mapserver container.
CONFIG
  ENV
    MS_MAP_PATTERN "^/etc/mapserver/[^/]+\.map$"
    MS_ERRORFILE "stderr"
  END
END
