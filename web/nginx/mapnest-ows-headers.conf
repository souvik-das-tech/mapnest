# Headers for MapServer responses (WMS/WFS). Images and XML are not
# scripts; the sandboxing CSP neutralises any HTML (GetFeatureInfo
# text/html) that might carry data from a table.
add_header X-Content-Type-Options "nosniff" always;
add_header Content-Security-Policy "default-src 'none'; img-src 'self' data:; style-src 'unsafe-inline'; sandbox" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Strict-Transport-Security $mapnest_hsts always;
# MapServer's Apache sets the same headers; keep one copy of each.
proxy_hide_header X-Content-Type-Options;
proxy_hide_header Content-Security-Policy;
proxy_hide_header Referrer-Policy;
