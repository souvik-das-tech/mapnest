# MapServer 8 global config (PLAN.md §8).
CONFIG
  ENV
    # Default mapfile (all layers), generated by msapi.
    MS_MAPFILE "/etc/mapserver/services.map"
    # map= may only name services.map or a workspace mapfile ws_<name>.map
    # (written by msapi; /ows/<name> rewrites to it, see mapnest-vhost.conf).
    # Temp files (.services-*.tmp.map) and any other path are refused.
    MS_MAP_PATTERN "^/etc/mapserver/(services|ws_[a-z][a-z0-9_]*)\.map$"
    # PGSERVICEFILE is set as container env in docker-compose.yml: from
    # here it does not reach libpq.
  END
END
