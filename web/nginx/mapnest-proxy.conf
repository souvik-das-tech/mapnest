# Shared proxy settings for /api and /ows (included per location).
proxy_http_version 1.1;
proxy_set_header Host $host;
proxy_set_header Connection "";
# Exactly one hop: the client as nginx sees it (after real_ip). msapi
# trusts this only from MSAPI_TRUSTED_PROXIES, so clients cannot spoof it.
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto $mapnest_proto;
# Do not reveal upstream software.
proxy_hide_header X-Powered-By;
proxy_hide_header X-AspNet-Version;
