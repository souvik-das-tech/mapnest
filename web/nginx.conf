# Template: ${MSAPI_UPSTREAM}, ${MAPSERVER_UPSTREAM} and ${NGINX_REAL_IP_FROM}
# are filled in by the nginx image's envsubst at start (PLAN.md §3).
# Security controls are listed in docs/security/VAPT-L1.md.

# --- rate limits (per client IP) ---------------------------------------------
# Sign-in: 10 per minute; msapi also locks a username or IP after
# MSAPI_LOGIN_MAX_ATTEMPTS failures.
limit_req_zone $binary_remote_addr zone=mapnest_login:10m rate=10r/m;
# Admin API.
limit_req_zone $binary_remote_addr zone=mapnest_api:10m rate=30r/s;
# WMS/WFS: a map view loads many tiles at once.
limit_req_zone $binary_remote_addr zone=mapnest_ows:10m rate=60r/s;
limit_conn_zone $binary_remote_addr zone=mapnest_conn:10m;
limit_req_status 429;
limit_conn_status 429;

# Scheme the browser used: from a TLS proxy in front (see
# docker-compose.tls.yml), else our own.
map $http_x_forwarded_proto $mapnest_proto {
  default $scheme;
  https   https;
}

# HSTS only over HTTPS (an empty value means add_header sends nothing).
map $mapnest_proto $mapnest_hsts {
  default "";
  https   "max-age=31536000; includeSubDomains";
}

server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;

  # No version in the Server header or error pages.
  server_tokens off;

  # Real client IP when a trusted proxy (TLS terminator) is in front.
  # NGINX_REAL_IP_FROM defaults to 127.0.0.1/32, i.e. trust nobody else.
  set_real_ip_from ${NGINX_REAL_IP_FROM};
  real_ip_header X-Forwarded-For;
  real_ip_recursive on;

  # Docker DNS; resolve upstreams per request so nginx starts even when
  # msapi/mapserver are down and recovers when they come up.
  resolver 127.0.0.11 valid=10s ipv6=off;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml text/xml application/xml;
  gzip_min_length 1024;

  # Slow-client protection.
  client_header_timeout 15s;
  client_body_timeout 60s;
  send_timeout 60s;
  keepalive_timeout 30s;
  large_client_header_buffers 4 16k;
  client_max_body_size 20m;
  limit_conn mapnest_conn 100;

  # Never serve dotfiles (.env, .git, …) even if one lands in the web root.
  location ~ /\. {
    return 404;
  }

  # --- admin API ---------------------------------------------------------------
  # msapi sets its own security headers on every response.
  location = /api/v1/auth/login {
    limit_req zone=mapnest_login burst=5 nodelay;
    limit_except POST { deny all; }
    set $msapi ${MSAPI_UPSTREAM};
    proxy_pass $msapi;
    include /etc/nginx/snippets/mapnest-proxy.conf;
  }

  # Backups can be large.
  location = /api/v1/system/restore {
    limit_req zone=mapnest_api burst=10 nodelay;
    client_max_body_size 512m;
    set $msapi ${MSAPI_UPSTREAM};
    proxy_pass $msapi;
    include /etc/nginx/snippets/mapnest-proxy.conf;
    proxy_request_buffering off;
    proxy_read_timeout 600s;
  }

  location /api/ {
    limit_req zone=mapnest_api burst=100 nodelay;
    set $msapi ${MSAPI_UPSTREAM};
    proxy_pass $msapi;
    include /etc/nginx/snippets/mapnest-proxy.conf;
    proxy_read_timeout 300s;
  }

  # --- WMS / WFS (public, read-only) ------------------------------------------
  # /ows?... -> MapServer /?...
  location = /ows {
    limit_req zone=mapnest_ows burst=200 nodelay;
    limit_except GET POST { deny all; }
    set $mapserver ${MAPSERVER_UPSTREAM};
    proxy_pass $mapserver/$is_args$args;
    include /etc/nginx/snippets/mapnest-proxy.conf;
    include /etc/nginx/snippets/mapnest-ows-headers.conf;
    proxy_read_timeout 180s; # matches MapServer IO_TIMEOUT
  }

  # /ows/<workspace>?... -> MapServer /ows/<workspace>?..., which the
  # mapserver container rewrites to that workspace's mapfile.
  location ~ "^/ows/(?<workspace>[a-z][a-z0-9_]{0,39})/?$" {
    limit_req zone=mapnest_ows burst=200 nodelay;
    limit_except GET POST { deny all; }
    set $mapserver ${MAPSERVER_UPSTREAM};
    proxy_pass $mapserver/ows/$workspace$is_args$args;
    include /etc/nginx/snippets/mapnest-proxy.conf;
    include /etc/nginx/snippets/mapnest-ows-headers.conf;
    proxy_read_timeout 180s; # matches MapServer IO_TIMEOUT
  }

  # --- admin UI (static) -------------------------------------------------------
  # Hashed build assets: cache for a year.
  location /assets/ {
    limit_except GET { deny all; }
    include /etc/nginx/snippets/mapnest-security-headers.conf;
    add_header Cache-Control "public, immutable" always;
    expires 1y;
    try_files $uri =404;
  }

  # SPA fallback; index.html is never cached.
  location / {
    limit_except GET { deny all; }
    include /etc/nginx/snippets/mapnest-security-headers.conf;
    add_header Cache-Control "no-cache" always;
    try_files $uri /index.html;
  }
}
