version: 2
updates:
  - package-ecosystem: gomod
    directory: /server/msapi
    schedule: { interval: weekly }
    groups:
      go-deps: { patterns: ["*"] }
  - package-ecosystem: npm
    directory: /web
    schedule: { interval: weekly }
    groups:
      npm-minor-patch:
        update-types: [minor, patch]
  - package-ecosystem: docker
    directory: /server/msapi
    schedule: { interval: weekly }
  - package-ecosystem: docker
    directory: /web
    schedule: { interval: weekly }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
